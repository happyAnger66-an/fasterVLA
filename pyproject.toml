[project]
name = "fastervla"
version = "0.1.0"
description = "Faster-than-demonstration VLA training and deploy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# acados_template needs a system acados build (ACADOS_SOURCE_DIR / libs); casadi is pip-installable.
mpc = ["casadi>=3.6", "acados_template>=0.4"]
deploy-client = [
  "websockets>=12",
  "scipy>=1.11",
  "typing_extensions>=4.0",
  "msgpack>=1.0",
]

[project.scripts]
fastervla-train = "fastervla.training.cli:main"
fastervla-deploy = "fastervla.deploy.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "openpi: needs openpi + jax (debug train smoke)",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
