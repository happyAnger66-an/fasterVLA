# h7 · 正常倍速 soft：κ=1.0 + lead + 4+4 + ZP@3Hz + pchip（对齐老栈平滑，不下发）
# 启动:
#   source scripts/h7/env.sh
#   fastervla-deploy run --config configs/deploy/h7_soft_1x.yaml
# 实机:
#   fastervla-deploy run --config configs/deploy/h7_soft_1x.yaml --mode execute

meta:
  name: h7_soft_1x
  robot_aid: G2A0205C800352
  machine: h7

run:
  mode: shadow
  duration_s: 600.0
  results_dir: results
  flush_every_s: 30.0

policy:
  host: 127.0.0.1
  port: 8013
  prompt: "Put the shuttlecock into the shuttlecock tube."

speed:
  kappa: 1.0
  kappa_max: 2.0
  kappa_min: 1.0

retimer:
  type: uniform

inference:
  tracker: lead
  execution_prefix_frames: 4
  execution_buffer_frames: 4
  arm_chunk_filter: zero_phase_dct
  arm_chunk_filter_cutoff_hz: 3.0
  arm_interpolation: pchip

robot:
  sdk_root: /home/agi/app/gdk
  sdk_source_ip: 192.168.112.212
  discovery_uri: http://192.168.112.212:2379
