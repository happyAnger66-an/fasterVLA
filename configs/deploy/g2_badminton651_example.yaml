# Example deploy recipe (schema: docs/deploy-config.md).
# Loadable today via: fastervla-deploy run --config configs/deploy/...
# Only CLI-wired keys are accepted; QP extras live in TimeAxisQPConfig defaults.

meta:
  name: g2_badminton651_example
  robot_aid: G2A0004C205445

run:
  mode: shadow
  duration_s: 60.0
  results_dir: results
  flush_every_s: 30.0

policy:
  host: 10.42.1.201
  port: 8013
  prompt: "Put the shuttlecock into the shuttlecock tube."

speed:
  kappa: 1.0
  kappa_max: 2.0
  kappa_min: 1.0

retimer:
  type: uniform

inference:
  tracker: lead
  execution_prefix_frames: 4
  execution_buffer_frames: 4
  arm_chunk_filter: zero_phase_dct
  arm_chunk_filter_cutoff_hz: 3.0
  arm_interpolation: pchip
  t_infer_min_s: 0.0
  t_switch_min_s: 0.0

robot:
  sdk_root: /home/agi/app/gdk
