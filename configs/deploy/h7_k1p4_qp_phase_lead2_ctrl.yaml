# h7 · 【默认工作点】κ=1.4 Lead2 + 控制护栏（2026-11-25 M4b_ctrl：10/10 一次）
# 相对盲目 κ=1.4：transport=κ、接触窗×κ、闭爪降 lead、grip_delta 去微抖。
#   fastervla-deploy run --config configs/deploy/h7_k1p4_qp_phase_lead2_ctrl.yaml \
#     --mode execute --duration-s 180 --tag M4b_ctrl

meta:
  name: h7_k1p4_qp_phase_lead2_ctrl
  robot_aid: G2A0205C800352
  machine: h7

run:
  mode: shadow
  duration_s: 600.0
  results_dir: results
  flush_every_s: 30.0

policy:
  host: 127.0.0.1
  port: 8013
  prompt: "Put the shuttlecock into the shuttlecock tube."

speed:
  kappa: 1.4
  kappa_max: 2.0
  kappa_min: 1.0

retimer:
  type: qp
  contact_kappa: 1.0
  contact_window_frames: 12
  contact_window_scale_kappa: true
  contact_grip_delta: 0.08
  transport_kappa_max: 1.4
  prefix_lock: true
  lock_extra_frames: 2

inference:
  tracker: lead
  execution_prefix_frames: 4
  execution_buffer_frames: 4
  arm_chunk_filter: zero_phase_dct
  arm_chunk_filter_cutoff_hz: 3.0
  arm_interpolation: pchip

lead_tracker:
  tau_s: 0.09
  gain: 0.35
  max_lead_rad: 0.10
  lead_smooth_tau_s: 0.040
  hold_during_blend: true
  closed_grip_max_lead_rad: 0.05

robot:
  sdk_root: /home/agi/app/gdk
  sdk_source_ip: 192.168.112.212
  discovery_uri: http://192.168.112.212:2379
