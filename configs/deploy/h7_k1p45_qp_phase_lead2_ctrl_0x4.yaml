# h7 · M5_p0 护栏 + prefix=0，小步抬 κ=1.45（对照 1.4 的 lead2_ctrl_0x4）
# 相对 0x4：仅 kappa / transport_kappa_max 1.4→1.45；接触窗×κ、闭爪 lead 不变。
# 硬门槛：first≥95%；不打桌；松→松 / 搬运不差于 M5_p0；晃可接受。
#   fastervla-deploy run --config configs/deploy/h7_k1p45_qp_phase_lead2_ctrl_0x4.yaml \
#     --mode execute --duration-s 180 --tag M5_k145

meta:
  name: h7_k1p45_qp_phase_lead2_ctrl_0x4
  robot_aid: G2A0205C800352
  machine: h7

run:
  mode: shadow
  duration_s: 600.0
  results_dir: results
  flush_every_s: 30.0

policy:
  host: 127.0.0.1
  port: 8013
  prompt: "Put the shuttlecock into the shuttlecock tube."

speed:
  kappa: 1.45
  kappa_max: 2.0
  kappa_min: 1.0

retimer:
  type: qp
  contact_kappa: 1.0
  contact_window_frames: 12
  contact_window_scale_kappa: true
  contact_grip_delta: 0.08
  transport_kappa_max: 1.45
  prefix_lock: true
  lock_extra_frames: 2

inference:
  tracker: lead
  execution_prefix_frames: 0
  execution_buffer_frames: 4
  arm_chunk_filter: zero_phase_dct
  arm_chunk_filter_cutoff_hz: 3.0
  arm_interpolation: pchip

lead_tracker:
  tau_s: 0.09
  gain: 0.35
  max_lead_rad: 0.10
  lead_smooth_tau_s: 0.040
  hold_during_blend: true
  closed_grip_max_lead_rad: 0.05

robot:
  sdk_root: /home/agi/app/gdk
  sdk_source_ip: 192.168.112.212
  discovery_uri: http://192.168.112.212:2379
