# h7 · κ=1.4 MPC + M4b 控制护栏（冲一次率/稳，对照 M4b_ctrl Lead）
#
# 表内综合：
#   - 找球最快：M3_MPC@1.3（找球 p50 2.31、lag 49、EE 3.3）但 first≈88%
#   - 搬运快且全一次：M4b_ctrl@1.4 Lead2 护栏（搬运 1.73、周期 4.57、10/10）
#   - 盲目 κ1.4 / R4@1.5 无护栏：一次率或打桌 → 否决
# 本配方：复用 M4b retimer 护栏 + tracker=mpc；降级 Lead 带闭爪收 lead。
# 验收：相对 M4b_ctrl，first_try ≥95% 且 找球/搬运 p50 不差于 M4b；再谈抬 κ。
#
#   source scripts/h7/env.sh   # 需 acados；否则会整场降级 Lead
#   fastervla-deploy run --config configs/deploy/h7_k1p4_qp_phase_mpc_ctrl.yaml \
#     --mode execute --duration-s 180 --tag M5_MPC_ctrl

meta:
  name: h7_k1p4_qp_phase_mpc_ctrl
  robot_aid: G2A0205C800352
  machine: h7

run:
  mode: shadow
  duration_s: 600.0
  results_dir: results
  flush_every_s: 30.0

policy:
  host: 127.0.0.1
  port: 8013
  prompt: "Put the shuttlecock into the shuttlecock tube."

speed:
  kappa: 1.4
  kappa_max: 2.0
  kappa_min: 1.0

retimer:
  type: qp
  # 与 M4b_ctrl 对齐：接触贴 1.0×、窗随 κ 拉长、搬运封顶=κ
  contact_kappa: 1.0
  contact_window_frames: 12
  contact_window_scale_kappa: true
  contact_grip_delta: 0.08
  transport_kappa_max: 1.4
  prefix_lock: true
  lock_extra_frames: 2

inference:
  tracker: mpc
  execution_prefix_frames: 4
  execution_buffer_frames: 4
  arm_chunk_filter: zero_phase_dct
  arm_chunk_filter_cutoff_hz: 3.0
  arm_interpolation: pchip

# MPC 超时/失败降级；闭爪收 lead 对齐 M4b（抑搬运晃）
lead_tracker:
  tau_s: 0.09
  gain: 0.35
  max_lead_rad: 0.10
  lead_smooth_tau_s: 0.040
  hold_during_blend: true
  closed_grip_max_lead_rad: 0.05

robot:
  sdk_root: /home/agi/app/gdk
  sdk_source_ip: 192.168.112.212
  discovery_uri: http://192.168.112.212:2379
