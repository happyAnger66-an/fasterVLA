# h7 · 跟球/夹取反应专用（勿用于放球吞吐评测）
# 底座=今晚 Dyn_cw8（接触窗8 · κ1.4 · contact_κ1.0）
#   fastervla-deploy run --config configs/deploy/h7_follow_cw8.yaml --mode execute --duration-s 120 --tag F0_follow


meta:
  name: h7_follow_cw8
  robot_aid: G2A0205C800352
  machine: h7

run:
  mode: shadow
  duration_s: 600.0
  results_dir: results
  flush_every_s: 30.0

policy:
  host: 127.0.0.1
  port: 8013
  prompt: "Put the shuttlecock into the shuttlecock tube."

speed:
  kappa: 1.4
  kappa_max: 2.0
  kappa_min: 1.0

retimer:
  type: qp
  contact_kappa: 1.0
  contact_window_frames: 8
  contact_window_scale_kappa: true
  contact_grip_delta: 0.08
  transport_kappa_max: 1.4
  prefix_lock: true
  lock_extra_frames: 2

inference:
  tracker: lead
  execution_prefix_frames: 0
  execution_buffer_frames: 4
  arm_chunk_filter: zero_phase_dct
  arm_chunk_filter_cutoff_hz: 3.0
  arm_interpolation: pchip

lead_tracker:
  tau_s: 0.09
  gain: 0.35
  max_lead_rad: 0.10
  lead_smooth_tau_s: 0.040
  hold_during_blend: true
  closed_grip_max_lead_rad: 0.05

robot:
  sdk_root: /home/agi/app/gdk
  sdk_source_ip: 192.168.112.212
  discovery_uri: http://192.168.112.212:2379
