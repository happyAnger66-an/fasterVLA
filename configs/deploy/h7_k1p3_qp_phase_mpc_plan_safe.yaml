# h7 · MPC plan 预览安全重试（对照否决的 M5_MPC_plan@1.4）
#
# 否决场证据：|cmd−ref| p95≈0.18 / max≈0.33（Lead≤0.10）；搬运 util p95=149%；
# 搬运 3.32s；first 25%；体感左右摆 + 打桌。根因不是「没用上 MPC」，而是
# plan 预览在 κ=1.4 下允许过大偏航。
#
# 本配方相对 M5_MPC_plan：
#   1) κ 1.4→1.3（对齐昨夜 M3 找球优势区，先稳再抬）
#   2) 仍 mpc_preview=plan（长远路线不退回 linear-only）
#   3) w_ddy↑ / dy_max↓ / ddy_max↓（抑急加与大步）
#   4) 代码侧强制 |cmd−ref|≤lead_max（0.10；闭爪 0.05）——与 Lead2 护栏同级
#   5) 合块门暂留 4+4；过门后再叠 prefix=0
#
#   source scripts/h7/env.sh && source /home/agi/deps/acados_env.sh
#   fastervla-deploy run --config configs/deploy/h7_k1p3_qp_phase_mpc_plan_safe.yaml \
#     --mode execute --duration-s 180 --tag M5_MPC_plan_safe

meta:
  name: h7_k1p3_qp_phase_mpc_plan_safe
  robot_aid: G2A0205C800352
  machine: h7

run:
  mode: shadow
  duration_s: 600.0
  results_dir: results
  flush_every_s: 30.0

policy:
  host: 127.0.0.1
  port: 8013
  prompt: "Put the shuttlecock into the shuttlecock tube."

speed:
  kappa: 1.3
  kappa_max: 2.0
  kappa_min: 1.0

retimer:
  type: qp
  contact_kappa: 1.0
  contact_window_frames: 12
  contact_window_scale_kappa: true
  contact_grip_delta: 0.08
  transport_kappa_max: 1.3
  prefix_lock: true
  lock_extra_frames: 2

inference:
  tracker: mpc
  mpc_preview: plan
  mpc_w_track0: 12.0
  mpc_w_ddy: 40.0
  mpc_dy_max_rad: 0.03
  mpc_ddy_max_rad: 0.25
  execution_prefix_frames: 4
  execution_buffer_frames: 4
  arm_chunk_filter: zero_phase_dct
  arm_chunk_filter_cutoff_hz: 3.0
  arm_interpolation: pchip

lead_tracker:
  tau_s: 0.09
  gain: 0.35
  max_lead_rad: 0.10
  lead_smooth_tau_s: 0.040
  hold_during_blend: true
  closed_grip_max_lead_rad: 0.05

robot:
  sdk_root: /home/agi/app/gdk
  sdk_source_ip: 192.168.112.212
  discovery_uri: http://192.168.112.212:2379
